name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (incl. security rules)
        run: ruff check app tests
      - name: Tests
        run: pytest -q
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t test-bench-commissioning .
      - name: Smoke test with the same settings as Render
        run: |
          docker run -d --name smoke -e PORT=10000 -e FORWARDED_ALLOW_IPS='*' -e COOKIE_SECURE=1 -p 10000:10000 test-bench-commissioning
          for i in $(seq 1 30); do curl -fs localhost:10000/healthz && exit 0; sleep 2; done
          docker logs smoke; exit 1
