[project]
name = "test-bench-commissioning"
version = "2.0.0"
description = "Digital workflow for test bench commissioning: role-based dashboards, dependency-aware prioritised notifications"
authors = [{ name = "Abhishek Lakhani" }]
requires-python = ">=3.12"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"app/config.py" = ["S105"]
"app/web/i18n.py" = ["E501"]  # long user-facing sentences
"app/seed.py" = ["E501"]  # process configuration texts
"app/domain/analysis.py" = ["E501"]
"app/migrations/*" = ["E501", "UP", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
