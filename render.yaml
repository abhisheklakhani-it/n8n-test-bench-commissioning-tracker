# Public demo on Render (free plan, Docker, Frankfurt). Fictional demo data.
# For data that must survive restarts and updates (e.g. the process analysis), set DATABASE_URL to a
# PostgreSQL database in the Render dashboard. Without it the app uses SQLite on an ephemeral disk.
services:
  - type: web
    name: test-bench-commissioning
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # secrets: entered in the Render dashboard, never stored in the repository
      - key: DATABASE_URL
        sync: false
      - key: ANALYST_USERNAME
        sync: false
      - key: ANALYST_PASSWORD
        sync: false
      - key: ANALYST_FULL_NAME
        sync: false
